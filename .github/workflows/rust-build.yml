# ------------------------------------------------------------
# GitHub Actions – OBenchmark Cross Platform Build
# Windows / macOS / Linux – x86-64, ARM64 (+ RISC-V for Linux)
# ------------------------------------------------------------

name: OBenchmark – Cross Platform Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

env:
  BINARY_NAME: obenchmark
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # ---------- Linux ----------
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: linux-x86_64
            ext: ""
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: linux-arm64
            ext: ""
            archive: tar.gz
          - os: ubuntu-latest
            target: riscv64gc-unknown-linux-gnu
            artifact: linux-riscv64
            ext: ""
            archive: tar.gz
            cross: true

          # ---------- Windows ----------
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x86_64
            ext: .exe
            archive: zip
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact: windows-arm64
            ext: .exe
            archive: zip

          # ---------- macOS ----------
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: macos-arm64
            ext: ""
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: macos-x86_64
            ext: ""
            archive: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Linux deps for wgpu + X11 + Wayland (not needed when using `cross`)
      - name: Install Linux build deps
        if: runner.os == 'Linux' && !matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev \
            libwayland-dev libxkbcommon-dev \
            libudev-dev \
            libvulkan-dev \
            libfontconfig1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      # Cache Cargo registry
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ matrix.artifact }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ matrix.artifact }}-cargo-

      # Cache target build folder
      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ matrix.artifact }}-target-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ matrix.artifact }}-target-

      - name: Build release
        shell: bash
        env:
          # Cross-compilation (RISC-V): resolve fontconfig at runtime via dlopen
          # instead of linking, since the cross image lacks riscv64 fontconfig libs
          RUST_FONTCONFIG_DLOPEN: ${{ matrix.cross && '1' || '' }}
        run: |
          if [ -n "${{ matrix.cross }}" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Archive binary (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          tar -czvf ${{ env.BINARY_NAME }}-${{ matrix.artifact }}.tar.gz \
          -C target/${{ matrix.target }}/release ${{ env.BINARY_NAME }}
        shell: bash

      - name: Archive binary (zip)
        if: matrix.archive == 'zip'
        run: |
          Compress-Archive `
            -Path target\${{ matrix.target }}\release\${{ env.BINARY_NAME }}${{ matrix.ext }} `
            -DestinationPath ${{ env.BINARY_NAME }}-${{ matrix.artifact }}.zip
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.artifact }}
          path: ${{ env.BINARY_NAME }}-${{ matrix.artifact }}.${{ matrix.archive }}
          retention-days: 30
