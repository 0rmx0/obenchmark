[package]
name = "obenchmark"
version = "0.3.0"
edition = "2021"
build = "build.rs"

[dependencies]
slint = "1.17"

chrono = "0.4"
crossbeam-channel = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = { version = "0.30", features = ["multithread"] }
rayon = "1.8"
anyhow = "1.0"
dirs = "5.0"
num_cpus = "1.0"
flate2 = "1.0"
sha2 = "0.10"
rand = "0.8"
clap = { version = "4.4", features = ["derive"] }
indicatif = "0.17"

[build-dependencies]
slint-build = "1.17"

[target.'cfg(windows)'.dependencies]
wmi = "0.18.3"
